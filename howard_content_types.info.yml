name: 'Howard Content Types'
type: module
description: 'A comprehensive content type management suite for Howard University Drupal installations, providing structured content types, media management, and seamless integration with the idfive Component Library.'
version: '11.0.6'
core_version_requirement: ^10 || ^11

package: 'Howard University'

# Module information
configure: howard_content_types.admin
php: 8.1

# Custom module - not distributed via drupal.org
# Available via Packagist as howard/howard_content_types

# Dependencies
dependencies:
  - entity_reference_revisions
  - field
  - file
  - filter
  - focal_point
  - image
  - media
  - link
  - options
  - paragraphs
  - system
  - text
  - user
  - entity_browser
  - entity_browser_entity_form
  - media_entity_browser
  - path
  - metatag
  - drupal:media
  - drupal:views
